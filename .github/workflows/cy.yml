name: Trabalho de Conclusão da Disciplina de Automação na Camada Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node version
        run: node --version

      - name: Instalando dependências
        run: npm install

      - name: Run only trabalho-conclusao-disciplina spec
        run: npx cypress run --spec "cypress/e2e/trabalho-conclusao-disciplina.cy.js"

      - uses: actions/upload-artifact@v4
        if:  ${{ !cancelled() }}
        with:
          name: relatorios
          path:
            cypress/reports/
            cypress/screenshots
            cypress/videos