name: Trabalho de Conclusão da Disciplina de Automação na Camada Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node version
        run: node --version

      - name: Instalando dependências
        run: npm install

      - name: Run only trabalho-conclusao-disciplina spec
        run: npx cypress run --spec "cypress/e2e/trabalho-conclusao-disciplina.cy.js"

      - name: Garantir diretórios de relatório
        run: mkdir -p cypress/reports cypress/reports/html || true

      - name: Mesclar mochawesome JSON e gerar HTML
        run: |
          npx mochawesome-merge "cypress/reports/*.json" > cypress/reports/report.json || true
          npx marge cypress/reports/report.json -f report -o cypress/reports/html || true

      - name: Upload relatório mochawesome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mochawesome
          path: |
            cypress/reports
            cypress/reports/html